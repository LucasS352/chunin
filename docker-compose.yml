services:
  db:
    image: postgres:16-alpine
    container_name: tutu_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutu
      POSTGRES_PASSWORD: tutupassword
      POSTGRES_DB: tutu_db
    volumes:
      - tutu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutu -d tutu_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    container_name: tutu_app
    restart: unless-stopped
    ports:
      - "3555:3000"
    environment:
      DATABASE_URL: postgresql://tutu:tutupassword@db:5432/tutu_db?schema=public
      APP_USERNAME: ${APP_USERNAME:-tutu}
      APP_PASSWORD: ${APP_PASSWORD:-1234}
      SESSION_SECRET: ${SESSION_SECRET:-segredo_super_secreto_do_tutu_chunin_2026_will_of_fire}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  tutu_postgres_data:
    name: tutu_postgres_data
